[pytest]
# The project uses a src/ layout (src/configs, src/datasets, src/models, ...) and test
# modules import from it as `src.<package>...`. Running the plain `pytest` console-script
# entry point (as opposed to `python -m pytest`) does not add the current working directory
# to sys.path, so `src` would otherwise fail to resolve as a top-level package. `pythonpath`
# is pytest's built-in mechanism (since 7.0) for this - it prepends the given path(s) to
# sys.path before test collection, for both `pytest` and `python -m pytest` alike.
pythonpath = .
